name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pyproject.toml의 [tool.uv] required-version을 읽어 같은 uv 버전을 설치한다
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      # --locked: uv.lock이 pyproject.toml과 어긋나면 실패 (lock 갱신 누락 방지)
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
