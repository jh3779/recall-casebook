name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # DB 테스트(tests/test_load_db.py의 pg 테스트)를 건너뛰지 않으려고 일회용 Postgres를 띄운다 (Supabase와 같은 17)
    services:
      postgres:
        image: pgvector/pgvector:pg17  # Postgres 17 + pgvector (server/rag/embeddings.sql 테스트)
        env:
          POSTGRES_PASSWORD: localtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      # pyproject.toml의 [tool.uv] required-version을 읽어 같은 uv 버전을 설치한다
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      # --locked: uv.lock이 pyproject.toml과 어긋나면 실패 (lock 갱신 누락 방지)
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # REQUIRE_DB_TESTS=1: DB 테스트를 건너뛰지 않고 DB가 없으면 실패한다
      - name: Pytest
        run: uv run pytest -rs
        env:
          TEST_DATABASE_URL: postgresql://postgres:localtest@localhost:5432/postgres
          REQUIRE_DB_TESTS: "1"
