name: merge-gate
# 병합 게이트 — 현재 head 기준 자동 리뷰 존재(G-03), 미해결 리뷰 스레드 0개(G-05), 변경 요청 없음,
# ✅ 병합 전 검증 결과 코멘트(그 뒤에 새 리뷰 없음)를 확인해 커밋 상태 `merge-gate`를 남긴다.
# 판정 로직: scripts/ci/merge_gate.py (테스트: tests/test_merge_gate.py)
#
# 🔒 이 워크플로는 **기본 브랜치(main)의 코드만** 실행한다 (DEC-009).
#    - pull_request_target · issue_comment · workflow_dispatch는 모두 main의 워크플로 파일로 돈다.
#    - checkout도 main으로 고정하고, PR의 파일·명령은 실행하지 않는다. PR 정보는 API로만 읽는다.
#    - 그래서 PR이 이 파일이나 scripts/ci/merge_gate.py를 고쳐도 **자기 게이트에는 영향이 없다**.
#    - pull_request · pull_request_review 트리거는 PR 쪽 워크플로를 실행하므로 쓰지 않는다.
#
# 재판정: 코멘트를 남기면 다시 돈다 (결과 코멘트 게시가 곧 재판정). 리뷰 제출·스레드 resolve는
#   main 코드로 도는 트리거가 없으므로, 그 뒤에는 코멘트를 하나 남기거나 Actions에서 수동 실행한다.
#   (docs/MERGE_PROTOCOL.md 2-1절)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '재평가할 PR 번호'
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  evaluate:
    # 일반 이슈 코멘트는 제외 (PR 코멘트만)
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # PR 코드가 아니라 main의 판정 스크립트를 받는다 — PR head를 checkout하지 않는다
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 병합 게이트 판정 + 상태 게시
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          POST_STATUS: "1"
        run: python3 scripts/ci/merge_gate.py
