name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 목록을 수정할 때 CONTRIBUTING.md 브랜치 네이밍 표와
          # branch-name-check.yml의 PATTERN도 함께 갱신할 것.
          # (주의: `types: |-` literal block 안의 '#'은 리터럴 문자이므로 주석 금지.)
          types: |-
            feat
            fix
            refactor
            docs
            research
            data
            chore
            remove
          requireScope: false
          # subject: 대문자 시작만 금지 (한글/소문자/숫자/기호는 모두 허용).
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            PR 제목의 subject 부분은 대문자(A-Z)로 시작할 수 없습니다. 한국어는 허용됩니다.
            예: "feat: 하이브리드 검색 리트리버 추가" (O)
                "Feat: Add Retriever" (X)
