[project]
name = "lg-cns-rag"
version = "0.1.0"
description = "결함 선례 찾기 도우미 — NHTSA 공개 리콜·결함 조사에서 같은 부품의 선례와 원인 서술을 원문 그대로 찾는 RAG"
requires-python = ">=3.12"
# 런타임 의존성은 기술 스택이 확정되면 `uv add <패키지>`로 추가한다 (docs/guides/개발환경.md 4절).
dependencies = [
    "fastapi>=0.143.0",
    "fastembed==0.9.0",
    "numpy>=2.5.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.15",
]

[tool.uv]
# 배포용 패키지를 빌드하지 않는다 — 의존성·가상환경 관리 전용으로 uv를 쓴다.
package = false
# 팀원 모두 같은 uv 버전으로 uv.lock을 만들도록 고정한다 (file-converter와 같은 방식).
# CI의 astral-sh/setup-uv도 이 값을 읽는다. 올릴 때는 `uv self update` 후 이 값도 함께 바꾼다.
required-version = ">=0.12.5"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 한글 주석·docstring이 길어지는 경우가 많아 줄 길이는 포맷터에만 맡긴다
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
